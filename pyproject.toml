[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syspulse"
version = "1.0.0"
description = "A local-first, explainable Linux system health analyzer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SysPulse contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "psutil>=6.0,<8.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16.0,<3.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
syspulse = "syspulse.__main__:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["syspulse"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
